services:
  postgres:
    image: postgres:16-alpine
    container_name: my-game-shelf-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mygameshelf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${DB_NAME:-my_game_shelf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U mygameshelf -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # No ports - database is internal only

  mailpit:
    image: axllent/mailpit:latest
    container_name: my-game-shelf-mailpit
    restart: unless-stopped
    networks:
      - internal
    # No ports exposed — only reachable by the app container via internal network

  app:
    build: .
    container_name: my-game-shelf-app
    ports:
      - "${APP_PORT:-8080}:8080"  # Change this if you want to use a different port on the host
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mygameshelf}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
      DB_NAME: ${DB_NAME:-my_game_shelf}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-noreply@mygameshelf.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data: # Uses default driver (local)